name: aiida-jQMC public docs build

# The Sphinx manual, built as doc/Makefile builds it (warnings are errors), for
# the public distribution check and the GitHub Pages deploy, in public
# aiida-jQMC only. The process pages are rendered from the process specs
# (aiida.sphinxext), which needs an AiiDA profile: a throwaway SQLite one, no
# broker (`verdi presto`).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    name: Sphinx documentation
    if: github.repository == 'jqmc-project/aiida-jQMC'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the package and its documented Sphinx dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[docs]'
          python -m pip check
      - name: Build the current documentation
        run: |
          verdi presto
          make -C doc html
          test -s doc/_build/html/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: public-docs
          path: doc/_build/html/
          if-no-files-found: error
          retention-days: 7

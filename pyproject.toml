[build-system]
# setuptools builds the wheel and setuptools_scm supplies the version from the git tags, as for jQMC-forge.
# setuptools >= 77: the SPDX ``license`` expression and ``license-files`` below.
requires = ["setuptools >= 77", "setuptools_scm[toml] >= 10.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-jqmc"
description = "AiiDA plugin for jQMC"
dynamic = ["version"]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kosuke Nakano" }]
requires-python = ">=3.11"
keywords = ["aiida", "workflows", "quantum monte carlo", "jqmc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AiiDA",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # >= 2.8: BaseRestartWorkChain aborts on an unhandled failure (`on_unhandled_failure`, default 'abort')
    # instead of resubmitting it once with the same inputs.
    "aiida-core>=2.8,<3",
    # The lower bound is the first public jqmc release that has what the plugin imports
    # (jqmc.output_parser, orbital tiling); v0.2.2 does not.
    "jqmc>=0.3.0a1",
    "toml",
    # Imported directly (tiling, statistics); jqmc requires both as well.
    "h5py",
    "numpy",
]

[project.urls]
Source = "https://github.com/jqmc-project/aiida-jQMC"
"Bug tracker" = "https://github.com/jqmc-project/aiida-jQMC/issues"
jQMC = "https://github.com/jqmc-project/jQMC"

[project.optional-dependencies]
tests = ["pytest>=7", "jsonschema>=4.18"]
examples = ["aiida-shell>=0.8", "scipy"]
docs = [
    "sphinx >= 7.2, < 9.0",
    "myst-parser[linkify] >= 2.0, < 5.0",
    "sphinx-book-theme >= 1.1, < 2.0",
]

[project.entry-points."aiida.calculations"]
"jqmc.jqmc" = "aiida_jqmc.calculations.jqmc:JqmcCalculation"
"jqmc.tool" = "aiida_jqmc.calculations.tool:JqmcToolCalculation"

[project.entry-points."aiida.workflows"]
"jqmc.restart" = "aiida_jqmc.workflows.restart:JqmcRestartWorkChain"

[project.entry-points."aiida.parsers"]
"jqmc.jqmc" = "aiida_jqmc.parsers.jqmc:JqmcParser"
"jqmc.tool" = "aiida_jqmc.parsers.tool:JqmcToolParser"

[tool.setuptools.packages.find]
include = ["aiida_jqmc*"]

[tool.setuptools_scm]
version_file = "aiida_jqmc/_version.py"
local_scheme = "no-local-version"
# ``scm_version.node`` is ``g`` + the FULL commit hash, written at build time from the git checkout,
# so an installed distribution reports the commit it was built from (``aiida_jqmc._build_info``).
version_file_template = """# file generated by setuptools-scm
# don't change, don't track in version control
__version__ = version = {version!r}
__git_commit_full__ = {scm_version.node!r}
"""

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
